# 로컬에서 app + MySQL + Redis 를 한 번에 띄운다.
# 시크릿은 이 파일이 아니라 같은 디렉터리의 .env 에서 읽는다 (.env 는 .gitignore 대상).
#   실행:  docker compose up -d --build
#   종료:  docker compose down          (데이터 유지)
#   초기화: docker compose down -v      (볼륨까지 삭제 — DB 데이터 사라짐)

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: word_quiz
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"   # 호스트의 기존 MySQL(3306)과 충돌하지 않도록 3307로 노출
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # app이 "MySQL 프로세스는 떴지만 아직 연결은 안 되는" 순간에 붙어서 죽는 것을 막는다
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"   # 호스트의 기존 Redis(6379)와 충돌 방지
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 컨테이너끼리는 서비스 이름으로 통신한다. localhost가 아니라 mysql / redis.
      # 포트도 호스트 매핑(3307)이 아닌 컨테이너 내부 포트(3306)를 쓴다.
      DB_URL: jdbc:mysql://mysql:3306/word_quiz
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy   # 헬스체크 통과까지 대기
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
