name: Java CI with Gradle

# master로 push하거나 master를 향한 PR이 열릴 때 실행한다.
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # 소스를 읽기만 하면 되므로 최소 권한만 부여

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Gradle 배포판 설치 + 의존성/빌드 캐시 관리를 담당한다.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      # Windows에서 커밋된 gradlew는 실행 권한이 없다(git 인덱스상 100644).
      # 러너는 Linux라 이 줄이 없으면 Permission denied로 실패한다.
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 전체 build가 아니라 단위 테스트만 돌린다.
      # WordQuizAppApplicationTests는 @SpringBootTest라 MySQL/Redis 연결과
      # JWT_SECRET_KEY, GOOGLE_AI_API_KEY 환경변수를 요구하는데 CI에는 없다.
      # 통합 테스트가 필요해지면 services로 MySQL/Redis 컨테이너를 띄우면 된다.
      - name: Run unit tests
        run: ./gradlew test --tests "*ServiceTest*"

      # 테스트가 실패해도 리포트는 남겨서 원인을 확인할 수 있게 한다.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7
