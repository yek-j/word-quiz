# 공통 설정 — 환경별로 달라지는 값은 ${ENV_VAR:기본값} 형태로 외부화한다.
# 기본값은 로컬 개발 기준이라 설정 없이도 그대로 뜨고, Docker/운영에서는 환경변수가 덮어쓴다.
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/word_quiz}
    username: ${DB_USERNAME:localuser}
    password: ${DB_PASSWORD:localuser1234}
    hikari:
      maximum-pool-size: 10  # 최대 커넥션풀
      minimum-idle: 5   # 최소 유휴(사용되지 않는) 커넥션 수
      idle-timeout: 300000 # 5분, 커넥션이 풀에서 제거되기 전에 유지되는 시간
      connection-timeout: 20000 # 20초, 클라이언트가 커넥션을 기다리는 최대 시간
      max-lifetime: 1200000 # 20분, 풀에서 커넥션 최대 수명

  jpa:
    # defer-datasource-initialization 제거: data.sql을 JPA 이후로 미루는 옵션인데,
    # Flyway는 JPA보다 먼저 실행돼야 해서 'flyway ↔ entityManagerFactory' 순환 의존이 발생한다.
    # 스키마 생성은 이제 Flyway가 담당하므로 지연시킬 이유도 없다.
    hibernate:
      ddl-auto: validate   # 스키마 변경은 Flyway가, Hibernate는 엔티티와 일치하는지 검증만
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  ai:
    retry:
      max-attempts: 1
      on-client-errors: false
    model:
      chat: google-genai
    google:
      genai:
        chat:
          options:
            model: gemini-3.1-flash-lite-preview
        api-key: ${GOOGLE_AI_API_KEY}   # 기본값 없음 — 미설정 시 기동 실패시켜 노출을 막는다

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  sql:
    init:
      mode: never   # 시드 데이터는 data.sql 대신 Flyway 마이그레이션으로 이관

jwt:
  refresh-token-expire-days: 7
  access-token-expire-minutes: 15
  secret:
    key: ${JWT_SECRET_KEY}   # 기본값 없음 — 운영에서 기본 시크릿이 쓰이는 사고 방지

server:
  servlet:
    encoding:
      charset: UTF-8
      force: true
